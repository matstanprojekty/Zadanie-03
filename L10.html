    <title>Document</title>
</head>
<body>
    <table>
  <!-- Wiersz 1 -->
  <tr>
    <th>1</th>
    <th>2</th>
    <th>3</th>
    <th>4</th>
    <th>5</th>
    <th>6</th>
  </tr>
  <!-- Wiersz 2 -->
  <tr>
    <th>2</th>
    <td>a</td>
    <td class="light-green">b</td>
    <td class="light-green">c</td>
    <td>d</td>
    <td>e</td>
  </tr>
  <!-- Wiersz 3 -->
  <tr>
    <th>3</th>
    <td>f</td>
    <td>g</td>
    <td>h</td>
    <td>i</td>
    <td class="medium-green">j</td>
  </tr>
  <!-- Wiersz 4 -->
  <tr>
    <th>4</th>
    <td>k</td>
    <td>l</td>
    <td>m</td>
    <td>n</td>
    <td class="medium-green">o</td>
  </tr>
  <!-- Wiersz 5 -->
  <tr>
    <th>5</th>
    <td class="dark-green">p</td>
    <td class="dark-green">q</td>
    <td class="dark-green">r</td>
    <td>s</td>
    <td>t</td>
  </tr>
  <!-- Wiersz 6 -->
  <tr>
    <th>6</th>
    <td class="dark-green">u</td>
    <td class="dark-green">v</td>
    <td class="dark-green">w</td>
    <td>y</td>
    <td>z</td>
  </tr>
</table>

  </tr>
  <!-- Wiersz 4 -->
  <tr>
    <th>4</th>
    <td>k</td>
    <td>l</td>
    <td>m</td>
    <td>n</td>
  </tr>
  <!-- Wiersz 5 -->
  <tr>
    <th>5</th>
    <td colspan="3" rowspan="2" class="dark-green">p, q, r, u, v, w</td>

    <td>s</td>
    <td>t</td>
  </tr>
  <!-- Wiersz 6 -->
  <tr>
    <th>6</th>
    <td>y</td>
    <td>z</td>
  </tr>
</table>
